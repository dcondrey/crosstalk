[package]
name = "crosstalk-evolution"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Deterministic evolutionary discovery engine for Crosstalk"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1.89"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.8"
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1.51.0", features = ["macros", "rt", "time"] }
